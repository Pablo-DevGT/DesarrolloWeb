<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión · Sistema de Citas</title>
  <link rel="stylesheet" href="/comun/estilos.css">
</head>
<body>
  <header id="menu" data-activo="login"></header>

  <main class="contenedor contenedor-angosto">
    <h1>Iniciar sesión</h1>
    <p class="subtitulo">Acceso para la recepcionista y los doctores del consultorio.</p>

    <div id="alerta" class="oculto" role="status" aria-live="polite"></div>

    <form id="formulario" class="tarjeta" novalidate>
      <div class="form-grid">
        <div class="campo completo">
          <label for="usuario">Usuario</label>
          <input id="usuario" name="usuario" type="text" autocomplete="username" required
                 autocapitalize="none" spellcheck="false" autofocus>
        </div>
        <div class="campo completo">
          <label for="contrasena">Contraseña</label>
          <input id="contrasena" name="contrasena" type="password" autocomplete="current-password" required>
        </div>
      </div>
      <div class="barra-acciones" style="margin-top: 20px;">
        <button class="btn" type="submit" id="entrar">Entrar</button>
        <a class="ayuda" href="/citas/">¿Eres paciente? Solicita tu cita aquí</a>
      </div>
    </form>
  </main>

  <script src="/comun/comun.js"></script>
  <script>
    const formulario = document.getElementById('formulario');
    const alerta = document.getElementById('alerta');
    const botonEntrar = document.getElementById('entrar');

    // Solo se vuelve a rutas del propio sitio (evita redirecciones a otros dominios)
    function destinoDespuesDeEntrar(usuario) {
      const volver = new URLSearchParams(location.search).get('volver') || '';
      if (volver.startsWith('/') && !volver.startsWith('//')) return volver;
      return usuario.rol === 'doctor' ? '/agenda/' : '/pacientes/';
    }

    formulario.addEventListener('submit', async (evento) => {
      evento.preventDefault();
      ocultarAlerta(alerta);
      if (!formulario.checkValidity()) {
        formulario.reportValidity();
        return;
      }
      botonEntrar.disabled = true;
      try {
        const { usuario } = await api('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify(Object.fromEntries(new FormData(formulario))),
        });
        location.href = destinoDespuesDeEntrar(usuario);
      } catch (error) {
        mostrarAlerta(alerta, 'error', error.mensajes);
        formulario.elements.contrasena.value = '';
        formulario.elements.contrasena.focus();
      } finally {
        botonEntrar.disabled = false;
      }
    });

    // Si ya hay sesión, no tiene sentido ver el login
    api('/api/auth/sesion').then(({ usuario }) => {
      if (usuario) location.replace(destinoDespuesDeEntrar(usuario));
    }).catch(() => {});
  </script>
</body>
</html>
